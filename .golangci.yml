version: "2"
run:
  timeout: 10m
linters:
  default: standard
  enable:
    - errcheck
    - gocritic
    - gosec
    - misspell
    - revive
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
